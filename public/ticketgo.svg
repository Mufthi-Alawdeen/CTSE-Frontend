<svg xmlns="http://www.w3.org/AspectRatio" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF416C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4B2B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="64" y="128" width="384" height="256" rx="24" fill="url(#ticketGrad)" filter="url(#shadow)"/>
  
  <!-- Left Cutout -->
  <circle cx="64" cy="256" r="32" fill="#ffffff" />
  
  <!-- Right Cutout -->
  <circle cx="448" cy="256" r="32" fill="#ffffff" />
  
  <!-- Dashed Line -->
  <line x1="160" y1="136" x2="160" y2="376" stroke="#ffffff" stroke-width="8" stroke-dasharray="16, 16" opacity="0.5"/>
  
  <!-- Go Arrow -->
  <path d="M 280 192 L 344 256 L 280 320" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="200" y1="256" x2="320" y2="256" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
</svg>
